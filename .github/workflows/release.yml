name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload assets to"
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            tasks: :app:packageDmg
            artifact_name: macos-dmg
            artifact_path: build/app/compose/binaries/main/dmg/*.dmg
          - os: windows-latest
            tasks: :app:packageMsi :app:packageExe
            artifact_name: windows-installers
            artifact_path: |
              build/app/compose/binaries/main/msi/*.msi
              build/app/compose/binaries/main/exe/*.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Verify release version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          APP_VERSION="$(sed -n 's/^app.version=//p' gradle.properties | head -n 1 | tr -d '\r')"
          EXPECTED_TAG="v${APP_VERSION}"
          if [ -z "$APP_VERSION" ]; then
            echo "app.version is missing in gradle.properties"
            exit 1
          fi
          if [ "$RELEASE_TAG" != "$EXPECTED_TAG" ]; then
            echo "Release tag $RELEASE_TAG does not match app.version $APP_VERSION. Expected $EXPECTED_TAG."
            exit 1
          fi

      - name: Set Gradle executable
        if: runner.os != 'Windows'
        run: chmod +x ./gradlew

      - name: Package
        shell: bash
        run: ./gradlew ${{ matrix.tasks }} --no-daemon

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  publish:
    name: Upload Release Assets
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          gh release view "$RELEASE_TAG" --repo "$REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$RELEASE_TAG" --repo "$REPOSITORY" --title "$RELEASE_TAG" --generate-notes
          find release-assets -type f -print0 |
            xargs -0 gh release upload "$RELEASE_TAG" --repo "$REPOSITORY" --clobber
